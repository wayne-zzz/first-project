<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Task Manager v1.0</title>
    <link rel="stylesheet" href="script.css">
</head>
<body>
    <div>
        <h4 id="date">Date: </h4>
    </div>

    <h2 id="Title">
        Task Manager
    </h2>

    <div id="addEdit">
        <div id="addBtn">
            <button id="plusSign" class="btns">+ New Task</button>
            <button id="closeSign" style="display: none" class="btns">Close Taskbar</button>
        </div>
    
        <div id="EditBtn">
            <button id="editBtn" class="btns">Edit Task</button>
            <button id="uneditBtn" style="display: none" class="btns">Stop Editing</button>
        </div>

        <div id="sortDiv">
            <label for="sort by">Sort by:</label>
            <select name="sort by" id="sort">
                <option value="Due_date">Due Date</option>
                <option value="Priority">Priority</option>
            </select>
        </div>
    </div>

    <div id="taskBar" style="display: none">
        <input id="inputBar" type="text" placeholder="Enter Task">
        <input id="dueBar" type="date" placeholder="Enter Due Date">
        <input id="priBar" type="number" placeholder="Enter Value">
        <button id="createBtn">Add</button>
    </div>


    <div id="taskCtr">
        
    </div>

    <div id="taskCheckedCtr">

    </div>

    <script src="script.js"></script>

</body>
</html>

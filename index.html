<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Task Manager v1.0</title>
    <link rel="stylesheet" href="script.css">
</head>
<body>
    <div>
        <h1 id="date">Date: </h1>
    </div>

    <h2 id="Title">
        Task Manager
    </h2>

    <div id="addBtn">
        <button id="plusSign">+</button>
        <button id="closeSign" style="display: none">Close</button>
    </div>

    <div id="EditBtn">
        <button id="editBtn">EDIT</button>
        <button id="uneditBtn" style="display: none">CLOSE</button>
    </div>

    <div id="taskBar" style="display: none">
        <input id="inputBar" type="text" placeholder="Enter Task">
        <input id="dueBar" type="text" placeholder="Enter Due Date">
        <input id="priBar" type="text" placeholder="Enter Value">
        <button id="createBtn">Add</button>
    </div>

    <p>Tasks:</p>

    <div id="taskCtr">
        
    </div>

    <script src="script.js"></script>

</body>
</html>
